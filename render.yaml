databases:
  - name: chess-puzzle-db
    databaseName: chess_puzzle_db
    user: chess_puzzle_user
    plan: basic-256mb

services:
  - type: web
    name: chess-puzzle-platform
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chess-puzzle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
